version: "3.8"

services:
  neo4j:
    image: neo4j:5
    container_name: kgra-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme123}
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kgra-qdrant
    ports:
      - "6333:6333"   # REST/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

# NOTE: your MXBAI embedding server and Gemma 4B server run separately
# (whatever you're already serving them with) - just point MXBAI_API_URL /
# GEMMA_API_URL in .env at their endpoints. No API key required.

volumes:
  neo4j_data:
  qdrant_data:
